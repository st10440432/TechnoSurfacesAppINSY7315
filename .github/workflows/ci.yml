name: CI
on:
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  # Task 1 9.2: main is what is in production and takes merges only from a release
  # pull request from develop. Branch protection cannot name the source branch, so
  # this check does; it is required on main and skipped for pull requests into
  # develop. The branch name is passed through env, never written into the script.
  release-source:
    if: github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Pull requests into main come from develop
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::A pull request into main must come from develop (Task 1 9.2). This one comes from $HEAD_REF. Merge it into develop first."
            exit 1
          fi
          echo "Release pull request from develop."

  build-and-test:
    runs-on: ubuntu-24.04
    services:
      # SQL Server for the integration tests. Throwaway: it exists for this job
      # only and is reachable only from it.
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CiOnly-Password-2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P CiOnly-Password-2026 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build (warnings as errors)
        run: dotnet build --no-restore -c Release -warnaserror
      - name: Unit tests
        run: >
          dotnet test tests/TechnoSurfaces.UnitTests -c Release --no-build
          --logger trx --collect:"XPlat Code Coverage" --results-directory results/unit
      - name: Integration tests
        if: hashFiles('tests/TechnoSurfaces.IntegrationTests/*.csproj') != ''
        env:
          TECHNOSURFACES_TEST_SQL: Server=localhost,1433;User ID=sa;Password=CiOnly-Password-2026;TrustServerCertificate=True
        run: >
          dotnet test tests/TechnoSurfaces.IntegrationTests -c Release --no-build
          --logger trx --collect:"XPlat Code Coverage" --results-directory results/integration
      - name: Coverage summary
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"results/**/coverage.cobertura.xml" -targetdir:results/coverage -reporttypes:MarkdownSummaryGithub || true
          cat results/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: results
      - name: Publish
        run: dotnet publish TechnoSurfacesApp/TechnoSurfacesApp.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish

  # axe accessibility checks (WCAG 2.1 AA) of the main screens, signed in as each
  # role, at a phone and a desktop width (Task 2 feedback). A job of its own beside
  # build-and-test, with its own throwaway SQL Server, so it changes nothing in the
  # build or the tests. The demo accounts get a random password made for this run
  # only, so no secret is stored. Any violation fails the job; every screen's result
  # is uploaded as the accessibility-results artifact.
  accessibility:
    runs-on: ubuntu-24.04
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CiOnly-Password-2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P CiOnly-Password-2026 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/accessibility/package-lock.json
      - name: Password for the demo accounts, this run only
        run: |
          password="A11y-$(openssl rand -hex 12)"
          echo "::add-mask::$password"
          echo "DEMO_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build the app
        run: dotnet build TechnoSurfacesApp/TechnoSurfacesApp.csproj -c Release
      - name: Start the app
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: https://localhost:7043
          ConnectionStrings__DefaultConnection: Server=localhost,1433;Database=TechnoSurfaces_A11y;User ID=sa;Password=CiOnly-Password-2026;TrustServerCertificate=True;MultipleActiveResultSets=true
        run: |
          dotnet dev-certs https
          export Seed__DevelopmentPassword="$DEMO_PASSWORD"
          nohup dotnet run --project TechnoSurfacesApp/TechnoSurfacesApp.csproj -c Release --no-build --no-launch-profile > app.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -skf https://localhost:7043/health > /dev/null; then echo "The app is up."; exit 0; fi
            sleep 2
          done
          echo "::error::The app did not start within two minutes."
          cat app.log
          exit 1
      - name: Install Playwright and Chromium
        working-directory: tests/accessibility
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: axe on the main screens
        working-directory: tests/accessibility
        run: npm test
      - name: App log
        if: failure()
        run: cat app.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-results
          path: tests/accessibility/results
