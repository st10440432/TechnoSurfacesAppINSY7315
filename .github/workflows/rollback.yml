name: Rollback

# Started by hand from the Actions tab. Swaps the production slot back, so the
# previous release is live again within seconds, after a reviewer approves the
# production environment. Only for production with a slot (Standard tier, with
# SLOT_NAME set). Without one, a release is rolled back by re-running the CD run
# of the previous release.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # lets azure/login exchange a GitHub OIDC token; no stored Azure secret

# The same group as a CD run on main, so a rollback never races a release.
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  swap-back:
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://${{ vars.WEBAPP_NAME }}.azurewebsites.net
    steps:
      - name: Production has a slot
        if: vars.SLOT_NAME == ''
        run: |
          echo "::error::Production has no slot (SLOT_NAME is not set on the production environment). Roll back by re-running the CD run of the previous release."
          exit 1
      - name: Sign in to Azure (OIDC federated credential)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Swap the slot back
        run: |
          group=$(az webapp list --query "[?name=='${{ vars.WEBAPP_NAME }}'].resourceGroup | [0]" -o tsv)
          az webapp deployment slot swap --resource-group "$group" --name "${{ vars.WEBAPP_NAME }}" \
            --slot "${{ vars.SLOT_NAME }}" --target-slot production
      - name: Health check
        run: |
          url="https://${{ vars.WEBAPP_NAME }}.azurewebsites.net/health"
          for attempt in $(seq 1 30); do
            status=$(curl -s -o body.txt -w "%{http_code}" "$url" || true)
            echo "Attempt $attempt: HTTP $status $(cat body.txt 2>/dev/null)"
            if [ "$status" = "200" ] && grep -q "Healthy" body.txt; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::$url did not report Healthy within five minutes of the swap back"
          exit 1
